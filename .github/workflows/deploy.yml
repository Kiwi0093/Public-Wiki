name: Deploy-Wiki-Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 賦予 GITHUB_TOKEN 建立與推送分支的權限，防止 403 錯誤
permissions:
  contents: write

# 避免多個 commit 同時推送時產生並發構建衝突（PR 不取消 main 部署）
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-build-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 明確接受以 Node 24 執行 Runner Runtime，消除強制執行警告
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保留完整 Git 歷史紀錄，支援最後修改時間

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📂 Prepare Content & MDX Syntax Fix
        run: |
          python3 fix-mdx.py --prepare
          echo "=== 搬移後 docs 目錄狀態 ==="
          ls -la docs/

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 升級至 Node 22 LTS 建置環境
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚡ Cache Rspack Persistent Cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/rspack
          key: rspack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docusaurus.config.js') }}-${{ github.sha }}
          restore-keys: |
            rspack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'docusaurus.config.js') }}-

      - name: 🏗️ Build Site
        run: |
          # 注入記憶體上限設定，防止編譯大量文件與多語系時 OOM 中斷
          NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: 🚀 Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          keep_files: false
